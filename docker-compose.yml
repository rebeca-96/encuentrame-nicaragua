version: '3.8'

services:
  # Database with PostGIS extensions
  db:
    image: postgis/postgis:16-3.4
    container_name: encuentrame_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-encuentrame_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-encuentrame_secure_pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-encuentrame_nicaragua}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-encuentrame_user} -d ${POSTGRES_DB:-encuentrame_nicaragua}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: encuentrame_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: encuentrame_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-encuentrame_user}:${POSTGRES_PASSWORD:-encuentrame_secure_pass_2026!}@db:5432/${POSTGRES_DB:-encuentrame_nicaragua}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-encuentrame-nicaragua-min-32-chars!}
      STORAGE_DIR: /app/storage/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: encuentrame_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
